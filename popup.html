<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mezame</title>
    <link rel="stylesheet" href="/src/popup.css" />
  </head>
  <body>
    <article class="card" id="card" role="alertdialog" aria-labelledby="title" aria-describedby="message">
      <div class="hero" id="hero">
        <img id="photo" alt="" hidden />
        <time id="clock" hidden></time>
      </div>
      <div class="body">
        <span class="mark"></span>
        <h1 id="title"></h1>
        <p id="message"></p>
      </div>
      <footer>Click anywhere or press Esc to dismiss</footer>
      <div class="timer" id="timer" hidden><i id="bar"></i></div>
    </article>
    <div class="confetti" id="confetti" aria-hidden="true"></div>
    <script type="module" src="/src/popup.ts"></script>
  </body>
</html>
