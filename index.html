<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mezame</title>
    <link rel="stylesheet" href="/src/settings.css" />
  </head>
  <body>
    <div class="app">
      <header class="top">
        <div class="sun" aria-hidden="true"></div>
        <div>
          <h1>Mezame</h1>
          <p>A reminder that greets you the moment you're back.</p>
        </div>
      </header>

      <nav class="tabs" role="tablist" aria-label="Settings sections">
        <button role="tab" class="tab on" data-tab="reminder" aria-selected="true">Reminder</button>
        <button role="tab" class="tab" data-tab="triggers" aria-selected="false">Triggers</button>
        <button role="tab" class="tab" data-tab="schedule" aria-selected="false">Schedule</button>
        <button role="tab" class="tab" data-tab="look" aria-selected="false">Look</button>
      </nav>

      <main>
        <!-- REMINDER -->
        <section class="panel on" id="tab-reminder" role="tabpanel">
          <label for="title">Title</label>
          <input id="title" type="text" maxlength="80" data-k="title" />

          <label for="message">Message</label>
          <textarea id="message" rows="5" maxlength="400" data-k="message"></textarea>

          <label>Photo</label>
          <div class="photo">
            <div class="thumb" id="thumb" aria-hidden="true"></div>
            <div class="photo-actions">
              <button type="button" id="pick" class="btn secondary">Choose photo</button>
              <button type="button" id="clear" class="btn ghost">Remove</button>
              <small>PNG, JPG, WebP or BMP</small>
            </div>
          </div>
        </section>

        <!-- TRIGGERS -->
        <section class="panel" id="tab-triggers" role="tabpanel">
          <label class="switch"><input type="checkbox" data-k="popup_on_unlock" />
            <span class="track"></span>
            <span class="text">After I unlock my PC<small>The popup arrives as soon as your desktop is back.</small></span>
          </label>
          <label class="switch"><input type="checkbox" data-k="popup_on_display_wake" />
            <span class="track"></span>
            <span class="text">When the display wakes without a lock<small>For PCs that don't ask for a password after sleep.</small></span>
          </label>
          <label class="switch"><input type="checkbox" data-k="set_lock_screen" />
            <span class="track"></span>
            <span class="text">Put it on the lock screen<small>Draws the reminder onto your lock-screen picture, replacing the current one. Windows doesn't allow live popups over the lock screen or password box. Emoji and non-Latin text aren't drawn there.</small></span>
          </label>
          <label class="switch"><input type="checkbox" id="autostart" />
            <span class="track"></span>
            <span class="text">Start with Windows</span>
          </label>

          <div class="row">
            <div>
              <label for="delay">Wait before showing (seconds)</label>
              <input id="delay" type="number" min="0" max="30" step="0.1" data-k="delay_ms" data-mul="1000" />
            </div>
            <div>
              <label for="dismiss">Hide after (seconds, 0 = until clicked)</label>
              <input id="dismiss" type="number" min="0" max="600" step="1" data-k="dismiss_secs" />
            </div>
          </div>
        </section>

        <!-- SCHEDULE -->
        <section class="panel" id="tab-schedule" role="tabpanel">
          <label class="switch"><input type="checkbox" id="schedule_enabled" data-k="schedule_enabled" />
            <span class="track"></span>
            <span class="text">Auto popup reminder<small>Pops up on a schedule while you work, using the look you choose.</small></span>
          </label>

          <div id="schedule-body">
            <label>Repeat</label>
            <div class="seg" data-seg="schedule_mode" role="radiogroup">
              <button type="button" data-v="interval">Every so often</button>
              <button type="button" data-v="daily">At a set time</button>
            </div>

            <div id="mode-interval" class="mode">
              <label for="interval">Every (minutes)</label>
              <input id="interval" type="number" min="1" max="1440" step="1" data-k="schedule_interval_min" />
              <div class="chips quick" id="quick">
                <button type="button" data-m="15">15 min</button>
                <button type="button" data-m="30">30 min</button>
                <button type="button" data-m="60">1 hour</button>
                <button type="button" data-m="120">2 hours</button>
              </div>
            </div>

            <div id="mode-daily" class="mode">
              <label for="time">Time</label>
              <input id="time" type="time" data-k="schedule_time" />
              <label>On these days</label>
              <div class="chips" id="days">
                <button type="button" data-d="0">Mon</button><button type="button" data-d="1">Tue</button>
                <button type="button" data-d="2">Wed</button><button type="button" data-d="3">Thu</button>
                <button type="button" data-d="4">Fri</button><button type="button" data-d="5">Sat</button>
                <button type="button" data-d="6">Sun</button>
              </div>
            </div>
            <p class="note">If your PC is locked when a reminder is due, it shows right after you unlock.</p>
          </div>
        </section>

        <!-- LOOK -->
        <section class="panel" id="tab-look" role="tabpanel">
          <label>Animation style</label>
          <div class="styles" data-seg="style" role="radiogroup">
            <button type="button" data-v="minimal" class="style-card">
              <span class="sw sw-min"></span><b>Minimal</b><small>Soft focus-in, gentle rise</small>
            </button>
            <button type="button" data-v="glide" class="style-card">
              <span class="sw sw-glide"></span><b>Glide</b><small>Slides in from the screen edge</small>
            </button>
            <button type="button" data-v="funky" class="style-card">
              <span class="sw sw-funky"></span><b>Funky</b><small>Bright, bouncy, confetti</small>
            </button>
          </div>

          <div class="row">
            <div>
              <label>Theme <em>(minimal and glide)</em></label>
              <div class="seg" data-seg="theme" role="radiogroup">
                <button type="button" data-v="dark">Dark</button>
                <button type="button" data-v="light">Light</button>
              </div>
            </div>
            <div>
              <label>Title font <em>(minimal and glide)</em></label>
              <div class="seg" data-seg="font" role="radiogroup">
                <button type="button" data-v="serif">Serif</button>
                <button type="button" data-v="sans">Sans</button>
                <button type="button" data-v="mono">Mono</button>
              </div>
            </div>
          </div>

          <label>Accent colour <em>(funky uses it as the card colour)</em></label>
          <div class="swatches" id="swatches">
            <button type="button" data-c="#ffc933" style="--c:#ffc933" aria-label="Sun"></button>
            <button type="button" data-c="#ff5c8a" style="--c:#ff5c8a" aria-label="Pink"></button>
            <button type="button" data-c="#3ddcff" style="--c:#3ddcff" aria-label="Cyan"></button>
            <button type="button" data-c="#8b7bff" style="--c:#8b7bff" aria-label="Violet"></button>
            <button type="button" data-c="#5ef2a0" style="--c:#5ef2a0" aria-label="Mint"></button>
            <button type="button" data-c="#ff8a3d" style="--c:#ff8a3d" aria-label="Orange"></button>
            <label class="custom" title="Custom colour"><input type="color" id="accent" /></label>
          </div>

          <div class="row">
            <div>
              <label>Size</label>
              <div class="seg" data-seg="size" role="radiogroup">
                <button type="button" data-v="compact">Compact</button>
                <button type="button" data-v="regular">Regular</button>
                <button type="button" data-v="large">Large</button>
              </div>
            </div>
            <div>
              <label for="position">Position</label>
              <select id="position" data-k="position">
                <option value="center">Center</option>
                <option value="top-left">Top left</option>
                <option value="top-right">Top right</option>
                <option value="bottom-left">Bottom left</option>
                <option value="bottom-right">Bottom right</option>
              </select>
            </div>
          </div>

          <label class="switch"><input type="checkbox" data-k="show_clock" />
            <span class="track"></span><span class="text">Show the time badge</span>
          </label>
          <label class="switch"><input type="checkbox" data-k="show_timer" />
            <span class="track"></span><span class="text">Show the countdown bar</span>
          </label>
        </section>
      </main>

      <footer class="bar">
        <button type="button" id="save" class="btn primary">Save</button>
        <button type="button" id="test" class="btn secondary">Save and preview</button>
        <span id="status" role="status" aria-live="polite"></span>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
