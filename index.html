<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mezame Settings</title>
    <style>
      body { font-family: sans-serif; padding: 20px; background: #1e1e2e; color: #cdd6f4; }
      label { display: block; margin-top: 15px; font-weight: bold; }
      input, textarea { width: 100%; padding: 8px; margin-top: 5px; border-radius: 6px; border: 1px solid #45475a; background: #313244; color: #cdd6f4; box-sizing: border-box; }
      button { margin-top: 20px; padding: 10px 20px; background: #89b4fa; color: #1e1e2e; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
      button:hover { background: #b4befe; }
      .row { display: flex; gap: 15px; }
      .row > div { flex: 1; }
    </style>
  </head>
  <body>
    <h1>Mezame</h1>
    <p>Configure what happens when you return to your laptop.</p>

    <label for="message">Popup Message</label>
    <textarea id="message" rows="3"></textarea>

    <div class="row">
      <div>
        <label for="delay">Delay after wake (seconds)</label>
        <input type="number" id="delay" min="0" step="1" />
      </div>
      <div>
        <label for="dismiss">Auto-dismiss after (seconds)</label>
        <input type="number" id="dismiss" min="1" step="1" />
      </div>
    </div>

    <label for="threshold">Idle threshold to count as "away" (seconds)</label>
    <input type="number" id="threshold" min="1" step="1" />

    <button id="save">Save Settings</button>
    <button id="test-popup" style="background: #a6e3a1; margin-top: 10px;">Test Popup</button>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
