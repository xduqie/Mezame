[package]
name = "mezame"
version = "0.2.0"
edition = "2021"

[lib]
name = "mezame_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }

# Lock-screen image rendering + WinRT call (Windows only)
[target.'cfg(windows)'.dependencies]
ab_glyph = "0.2"

[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = ["Foundation", "Storage", "Storage_Streams", "System_UserProfile", "Win32_System_WinRT"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
