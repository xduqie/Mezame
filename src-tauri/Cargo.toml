[package]
name = "mezame"
version = "0.2.0"
edition = "2021"

[lib]
name = "mezame_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "webview-data-url"] }
tauri-plugin-store = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"
base64 = "0.22"
image = "0.25"

# Lock-screen image rendering + WinRT call (Windows only)
[target.'cfg(windows)'.dependencies]
ab_glyph = "0.2"

[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = ["Foundation", "Storage", "System_UserProfile", "Win32_System_WinRT"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
